<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>أَبْصَرْنا | Absarna</title>
    <meta name="description" content="أَبْصَرْنا — منصة إسلامية للفيديوهات والكتب والمقالات"/>
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="أَبْصَرْنا | Absarna"/>
    <meta property="og:title" content="أَبْصَرْنا | Absarna"/>
    <meta property="og:description" content="أَبْصَرْنا — منصة إسلامية للفيديوهات والكتب والمقالات"/>
    <!-- A raster, not the SVG the app itself uses: Facebook, WhatsApp, X, LinkedIn and
         Slack all refuse image/svg+xml for og:image, so an SVG here is the same as no
         preview image at all. Square because twitter:card is "summary". -->
    <meta property="og:image" content="/og-image.png"/>
    <meta property="og:image:type" content="image/png"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="1200"/>
    <meta property="og:image:alt" content="أَبْصَرْنا"/>
    <meta name="twitter:card" content="summary"/>
    <meta name="twitter:title" content="أَبْصَرْنا | Absarna"/>
    <meta name="twitter:description" content="أَبْصَرْنا — منصة إسلامية للفيديوهات والكتب والمقالات"/>
    <meta name="twitter:image" content="/og-image.png"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <!-- iOS ignores the SVG icon and alpha both: without this, "Add to Home Screen"
         uses a screenshot of the page. The PNG is opaque on the parchment ground on
         purpose, since iOS composites any transparency onto black. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
    <!-- Two values, so the mobile browser chrome follows the theme the inline script
         below picks. Values are --color-bg from src/index.css, light and dark. -->
    <meta name="theme-color" content="#FBF7EE" media="(prefers-color-scheme: light)"/>
    <meta name="theme-color" content="#10141C" media="(prefers-color-scheme: dark)"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Cairo carries the Arabic, and it replaced IBM Plex Sans Arabic for one concrete reason:
         Plex has the ﷲ glyph but no rule that forms it, so «الله» rendered as four bare letters
         with no shadda and no dagger alif. A fallback font cannot fix that — fallback is per
         MISSING CHARACTER, and lam, lam and heh all exist in Plex, so the browser never looks
         further. Verified against the font files rather than by eye: Plex has 0 such ligature
         rules, Cairo, Tajawal, Noto Naskh Arabic and Markazi Text each have one or two.

         Noto Naskh Arabic is the reading face, for prose people wrote and prose people read at
         length — comments, descriptions, article bodies (`font-reading`). Naskh is the shape
         Arabic is read in at length, and a catalogue of lectures and books is mostly that; the
         interface stays sans, because a button is a label rather than something to read. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Rubik:wght@300;400;500;600;700&family=Markazi+Text:wght@500;600;700&display=swap"
          rel="stylesheet">
    <!-- Amiri for the numbers inside the progress stars only (KhatamProgress), and so only the
         characters they use: its Arabic zero is a clear diamond at mid-height, where Naskh's sits
         low and small and «١٠» read as a one and a comma. `text=` makes this a few kilobytes. -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&text=%D9%A0%D9%A1%D9%A2%D9%A3%D9%A4%D9%A5%D9%A6%D9%A7%D9%A8%D9%A90123456789%D8%B5%20&display=swap" rel="stylesheet">
    <script>
      // Applied synchronously, before React/CSS paint anything, so a dark-mode visitor never
      // sees a flash of the light theme on load — ThemeContext (src/contexts/ThemeContext.jsx)
      // takes over from here and keeps this in sync with the toggle.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();

      // The same pre-paint trick for the interface language, and it matters more here than it
      // does for the theme: `dir` decides the layout, so applying it after React mounts would
      // show an English reader one frame of a right-to-left page. The map is restated rather
      // than imported from src/i18n/locales.js because this runs before there is a bundle —
      // the `dark` literal above is there for the same reason. `src/i18n/index.js` reads the
      // attribute back rather than re-deriving it, so the two cannot drift apart at runtime.
      //
      // Arabic is the default and `navigator.language` is deliberately not consulted: the
      // catalogue is Arabic, so an English interface is a thing to choose, not to be given.
      (function () {
        var DIRS = { ar: 'rtl', en: 'ltr' };
        try {
          var lang = localStorage.getItem('locale');
          if (DIRS[lang]) {
            document.documentElement.lang = lang;
            document.documentElement.dir = DIRS[lang];
          }
        } catch (e) {}
      })();
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
